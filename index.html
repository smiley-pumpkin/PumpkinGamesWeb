<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smiley Pumpkin</title>
<meta name="description" content="Smiley Pumpkin - coming soon.">
<link rel="icon" href="smiley-pumpkin.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --orange: #ff8a00;
    --yellow: #ffc21a;
    --ink: #2a1200;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--yellow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 24px);
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
    font-family: "Bangers", "Impact", sans-serif;
  }
  .logo {
    width: min(70vw, 56vh, 520px);
    height: auto;
    display: block;
    margin-bottom: calc(min(70vw, 56vh, 520px) * -0.04);
  }
  .coming-soon {
    font-size: clamp(40px, 11vw, 120px);
    line-height: 1;
    letter-spacing: 0.04em;
    white-space: nowrap;
    transform: rotate(-4deg);
    background: linear-gradient(180deg, var(--yellow) 15%, var(--orange) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
    filter: drop-shadow(0 4px 0 #7a2e00) drop-shadow(0 0 18px rgba(255, 138, 0, 0.35));
  }
  .dot {
    display: inline-block;
    background: linear-gradient(180deg, var(--yellow) 15%, var(--orange) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    animation: hop 1.6s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-0.18em); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>
  <img class="logo" src="smiley-pumpkin.png" alt="Smiley Pumpkin" width="720" height="720">
  <h1 class="coming-soon" aria-label="Coming Soon...">Coming Soon<span class="dots" aria-hidden="true"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></h1>
</body>
</html>
